services:
  app:
    build: .       
    ports:
      - "7000:7000"
    environment:
      DATABASE_URL: postgresql+asyncpg://myuser:mypassword@db:5432/chatdbdock
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: chatdbdock
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"